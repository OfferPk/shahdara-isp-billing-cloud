project_id = "shahdara-cloud-review"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://127.0.0.1:4173/**", "http://localhost:4173/**"]

[functions.invite-customer]
verify_jwt = true

[functions.customer-login]
verify_jwt = false

[functions.customer-portal-data]
verify_jwt = false

[functions.customer-portal-logout]
verify_jwt = false

[functions.manage-customer-credentials]
verify_jwt = true

[functions.change-customer-password]
verify_jwt = true

# The daemon uses a dedicated random bearer secret, not a Supabase Auth JWT.
# sync-agent-ingest validates it itself and requires server-side source confirmation.
[functions.sync-agent-ingest]
verify_jwt = false
